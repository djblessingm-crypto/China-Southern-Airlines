
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b38">
  <title>Staff Login | China Southern Airlines Virtual</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
      background:
        radial-gradient(circle at top right, #174c83 0, transparent 40%),
        linear-gradient(135deg, #06152c, #0b2c50);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 42px 34px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 70px rgba(0,0,0,.3);
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .brand h1 {
      font-size: 23px;
      letter-spacing: 1px;
    }

    .brand p {
      margin-top: 9px;
      color: #a9c8e9;
      font-size: 13px;
    }

    .heading {
      margin-bottom: 25px;
    }

    .heading h2 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .heading p {
      color: #b5c8dc;
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: bold;
      color: #dcecff;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(2,15,34,.55);
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #55aaff;
      box-shadow: 0 0 0 3px rgba(85,170,255,.13);
    }

    input::placeholder {
      color: #819bb7;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      color: #8fc5ff;
      background: none;
      cursor: pointer;
      font-size: 12px;
    }

    .login-button {
      width: 100%;
      padding: 16px;
      margin-top: 7px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(100deg, #1478d4, #35a5f5);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .login-button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: rgba(255,70,70,.13);
      color: #ffb6b6;
      border: 1px solid rgba(255,100,100,.25);
    }

    .message.success {
      display: block;
      background: rgba(60,200,130,.13);
      color: #a7f3c9;
      border: 1px solid rgba(60,200,130,.25);
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      color: #91aac4;
      font-size: 11px;
      line-height: 1.7;
    }

    @media(max-width: 480px) {
      .login-card {
        padding: 32px 23px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">

    <div class="brand">
      <img
        src="assets/csn-logo.png"
        alt="China Southern Airlines Virtual"
        onerror="this.style.display='none'"
      >
      <h1>CHINA SOUTHERN</h1>
      <p>AIRLINES VIRTUAL · STAFF PORTAL</p>
    </div>

    <div class="heading">
      <h2>Staff Sign In</h2>
      <p>Access your official CSN Virtual staff account.</p>
    </div>

    <form id="loginForm">

      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter your staff username"
          autocomplete="username"
          required
          maxlength="50"
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="togglePassword"
          >
            SHOW
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Sign In to Staff Portal
      </button>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

    </form>

    <div class="footer">
      Authorised CSN Virtual personnel only.<br>
      Protected by CSN Virtual account security.
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "HIDE" : "SHOW";
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showMessage("Please enter your username and password.", "error");
        return;
      }

      if (!window.supabaseClient) {
        showMessage("The secure login service is not connected.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";
      message.className = "message";

      try {
        const { data, error } = await window.supabaseClient.functions.invoke(
          "staff-login",
          {
            body: {
              username,
              password
            }
          }
        );

        if (error) {
          throw error;
        }

        if (!data || !data.success) {
          throw new Error(
            data?.message || "Login failed. Check your credentials."
          );
        }

        showMessage("Login successful. Opening staff portal...", "success");

        window.location.href = "staff.html";

      } catch (error) {
        console.error("Staff login error:", error);

        showMessage(
          error.message || "Unable to sign in. Please try again.",
          "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "Sign In to Staff Portal";
      }
    });
  </script>
</body>
</html>
